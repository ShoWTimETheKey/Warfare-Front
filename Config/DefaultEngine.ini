r.ScreenPercentage=100
r.SecondaryScreenPercentage.GameViewport=100
r.DynamicRes.OperationMode=0
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.pso.PrecompileThreadPoolPercentOfHardwareThreads=25
r.pso.PrecompileThreadPoolSizeMin=1
r.pso.PrecompileThreadPoolSizeMax=8
r.Streaming.PoolSize=3072
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxBounces=2
