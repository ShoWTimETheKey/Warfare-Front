[/Script/Engine.RendererSettings]
; Allow the official -ngxdisable startup switch used by Safe Mode.cmd.
r.NGX.Enable.AllowCommandLine=1
; V12: native 1440p candidate on the local RTX 5080. Actual timings remain a separate test.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
; The procedural terrain has no baked surface cards: evaluate hit lighting instead.
r.Lumen.HardwareRayTracing.LightingMode=2
; Lumen ray tracing handles reflections/GI; direct shadows retain the VSM path.
r.RayTracing.Shadows=False
r.RayTracing.UseTextureLod=True
r.AllowStaticLighting=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; One georeferenced map document streams only the visible native-resolution pages.
r.VirtualTextures=True

