[SystemSettings]
; UE 5.8 PC: async skin cache races streaming; retain full skin-cache quality
; on the graphics queue from startup, before the first skeletal mesh appears.
r.SkinCache.AsyncCompute=0
; Native Nanite CSM export uses constant bias and a separate geometry LOD.
; Keep its terrain shadow surface aligned with the visible surface.
r.Shadow.CSMDepthBias=20
r.Shadow.NaniteLODBias=0
r.AllowHDR=1
r.HDR.UI.CompositeMode=1
r.HDR.UI.CompositeEOTF=1
r.HDR.PaperWhite.Mode=1
r.NGX.DLSS.Preset=12
r.NGX.DLSSRR.Preset=6
